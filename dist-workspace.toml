[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
# No Windows yet: not built or tested there.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in: the first of these that
# applies, not Cargo's bin directory, since installer users need not have Rust.
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Signed build provenance for every artifact (`gh attestation verify`).
github-attestations = true
# Actions by commit, not by tag: a moved tag cannot change what a release
# runs. The `# vX.Y.Z` after each SHA lands in release.yml as a comment.
# Bump by hand with a dist upgrade: dist's defaults are actions/checkout v6,
# upload-artifact v7, download-artifact v8, attest v4.
github-action-commits = { "actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0", "actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2", "actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2", "actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2" }
# Publish only a commit that passed ci on main (.github/workflows/release-checks.yml).
# A local-artifacts job, not a plan job: the host job's condition counts local
# jobs but not plan jobs, so a failed plan job would skip the builds and still
# create the release.
local-artifacts-jobs = ["./release-checks"]
# Publish the container image from the published release's Linux binaries
# (.github/workflows/image.yml), after everything else.
post-announce-jobs = ["./image"]
github-custom-job-permissions = { "release-checks" = { contents = "read", actions = "read" }, "image" = { contents = "read", packages = "write", id-token = "write", attestations = "write" } }
