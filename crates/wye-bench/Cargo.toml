[package]
name = "wye-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Benchmark and regression gate: mock upstream, load client, and comparison"

[dependencies]
gateway-core.workspace = true
wye-testkit.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-rustls = { workspace = true, features = ["http1", "http2", "ring", "tls12"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
ring = { workspace = true, features = ["alloc"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["net", "process", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true

# Benchmark and test support: never released.
[package.metadata.dist]
dist = false
