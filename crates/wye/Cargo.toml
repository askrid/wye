[package]
name = "wye"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "A stateless gateway between coding agents or AI apps and the model providers"

[features]
# Benchmark builds only: counts heap allocations, served at GET /debug/alloc.
alloc-stats = []

[dependencies]
gateway-core.workspace = true
base64.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "server"] }
hyper-rustls = { workspace = true, features = ["http1", "http2", "ring", "tls12"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "server", "server-graceful", "tokio"] }
ring = { workspace = true, features = ["alloc"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true, features = ["parse", "serde", "std"] }
webpki-roots.workspace = true

[dev-dependencies]
wye-testkit.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "test-util"] }

[lints]
workspace = true

# The released binary; every other crate is excluded from releases.
[package.metadata.dist]
dist = true
