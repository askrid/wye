[package]
name = "wye-testkit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Test and benchmark support: a throwaway CA, signing keys, and a mock upstream"

[dependencies]
base64.workspace = true
bytes.workspace = true
http.workspace = true
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["http1", "http2", "server", "server-auto", "tokio"] }
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
ring = { workspace = true, features = ["alloc"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["net", "rt"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }

[lints]
workspace = true

# Benchmark and test support: never released.
[package.metadata.dist]
dist = false
