[workspace]
resolver = "3"
members = ["crates/gateway-core", "crates/wye", "crates/wye-bench", "crates/wye-testkit"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false
license = "WTFPL"
repository = "https://github.com/askrid/wye"

[workspace.dependencies]
gateway-core = { path = "crates/gateway-core" }
wye-testkit = { path = "crates/wye-testkit" }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
bytes = { version = "1.12", default-features = false, features = ["std"] }
http = { version = "1.5", default-features = false, features = ["std"] }
http-body-util = "0.1.5"
hyper = { version = "1.12", default-features = false }
hyper-rustls = { version = "0.27.10", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
memchr = { version = "2.7", default-features = false }
proptest = { version = "1.12", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false }
ring = { version = "0.17", default-features = false }
rustls = { version = "0.23", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
socket2 = { version = "0.6", default-features = false }
tokio = { version = "1.53", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
tower-service = { version = "0.3", default-features = false }
toml = { version = "1.1", default-features = false }
webpki-roots = { version = "1.0", default-features = false }
xxhash-rust = { version = "0.8.19", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
await_holding_lock = "deny"

[profile.release]
debug = "line-tables-only"

# Release archives are built with this profile. It is the benchmarked
# release profile unchanged: LTO and other tuning land only with a measured
# before/after (docs/research.md, "Performance techniques").
[profile.dist]
inherits = "release"
