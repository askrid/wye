[workspace]
resolver = "3"
members = ["crates/gateway-core", "crates/wye", "crates/wye-bench"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
gateway-core = { path = "crates/gateway-core" }
bytes = "1.12"
http = "1.5"
http-body-util = "0.1.5"
memchr = { version = "2.7", default-features = false }
hyper = { version = "1.12", default-features = false }
hyper-rustls = { version = "0.27.10", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
rustls = { version = "0.23", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
proptest = { version = "1.12", default-features = false, features = ["std"] }
tokio = { version = "1.53", default-features = false }
toml = { version = "1.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
await_holding_lock = "deny"

[profile.release]
debug = "line-tables-only"
