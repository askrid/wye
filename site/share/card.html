<!doctype html>
<!-- The share image, assets/share.png: a screenshot of this file at
     1280x640 (see site/README.md). It carries no facts, only the mark and
     the name, so it never goes stale; the title and description beside it
     in a link preview come from README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: "Wye Mono";
  src: url("../assets/fonts/wye-mono-semibold.woff2") format("woff2");
  font-weight: 600;
}
html, body { margin: 0; }
body {
  width: 1280px;
  height: 640px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 56px;
  background: #070707;
}
svg { width: 196px; height: 196px; flex: none; }
.tile { fill: #151515; stroke: #3a3a3a; stroke-width: 2; }
.ink { fill: #ededed; }
.accent { fill: #f2b544; }
span {
  color: #ededed;
  font: 600 208px/1 "Wye Mono", monospace;
  letter-spacing: -0.02em;
  /* The letters' x-height band, not the line box, centred on the tile. */
  position: relative;
  top: -24px;
}
</style>
</head>
<body>
<svg viewBox="0 0 64 64" aria-hidden="true"><rect class="tile" x="1" y="1" width="62" height="62" rx="14"/><path class="ink" d="M7 7h7.2v7.2H7zM14.15 14.15h7.2v7.2h-7.2zM21.3 21.3h7.2v7.2h-7.2zM28.45 28.45h7.2v28.65h-7.2z"/><path class="accent" d="M49.9 7h7.2v7.2h-7.2zM42.75 14.15h7.2v7.2h-7.2zM35.6 21.3h7.2v7.2h-7.2z"/></svg>
<span>wye</span>
</body>
</html>
