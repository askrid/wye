[package]
name = "wye-site"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
# The site's own address: the canonical link and the share tags use it.
homepage = "https://askrid.github.io/wye/"
publish = false
license = "MIT"
description = "Builds the Wye website from the repository's own files"

# Its own workspace: the site is built and checked apart from the gateway
# (site/check.sh), so its dependencies never enter the gateway's lockfile
# and a site change never runs the gateway's benchmark gate.
[workspace]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
