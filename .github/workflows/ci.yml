# Correctness gates for pushes to main and every pull request: formatting,
# lints, tests on Linux and macOS, release builds, and cargo-deny. bench.yml compares
# allocations and failed requests with the base branch; the latency and CPU
# gate runs locally before each commit (scripts/check.sh).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The stalled-client test keeps 256 loopback connections full. Their client
      # ends stand in for remote machines but autotune receive buffers out of
      # the same pool, and a 7 GB macOS runner has only 96 MB of it.
      - if: runner.os == 'macOS'
        run: sudo sysctl -w net.inet.tcp.autorcvbufmax=131072
      # The proxy tests open several hundred sockets; macOS allows 256 by default.
      - run: ulimit -n 8192 && cargo test --locked
      # Release builds, including the allocation-counting one the benchmark uses.
      - run: cargo build --locked --release -p wye -p wye-bench
      - run: cargo build --locked --release -p wye --features alloc-stats --target-dir target/alloc

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
