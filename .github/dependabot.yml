# Weekly updates: Cargo dependencies, as one grouped pull request for the
# gateway and one for the website (its own Cargo workspace), and the
# Dockerfile's base images.
#
# GitHub Actions are not updated here: release.yml is generated by `dist`
# and checked against its template, so an edited action there breaks the
# release. Actions are pinned by commit and bumped by hand; release.yml's
# through github-action-commits in dist-workspace.toml and `dist generate`.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
  # The Dockerfile's base images, pinned by tag and digest; both are bumped.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
