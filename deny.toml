# cargo-deny: licenses, advisories, bans, and sources of every dependency.
# CI runs it on pushes to main and every pull request (.github/workflows/ci.yml);
# run `cargo deny check` locally if cargo-deny is installed. Keep the license
# list as narrow as the locked graph allows.

[graph]
all-features = false

[advisories]
# Fail on any RustSec advisory, unmaintained or yanked crate.
yanked = "deny"

[licenses]
# Every license in the locked graph today (cargo metadata), nothing broader.
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "BSL-1.0",           # xxhash-rust
    "Unicode-3.0",       # unicode-ident
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla's root store data)
]
confidence-threshold = 0.9
# The workspace's own crates (WTFPL) are never published; only dependencies are checked.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path and are never
# published, so a path dependency without a version is not a wildcard risk.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
