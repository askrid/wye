# Wye for a product's backend: services on the official Anthropic and OpenAI
# SDKs reach the model APIs through one internal gateway (two replicas behind
# the cluster's load balancer). Model names, provider keys, failover, and
# prices live here instead of in each service.
#
# Each service gets its own gateway token, issued with the signing key and
# kept in the secret manager; a scheduled job reissues them weekly:
#
#   wye token issue support-bot --ttl 7d -c wye.toml --out support-bot.token
#
# and starts with no code change:
#
#   ANTHROPIC_BASE_URL=http://wye.internal:8080 ANTHROPIC_API_KEY=<its token>
#   OPENAI_BASE_URL=http://wye.internal:8080/v1 OPENAI_API_KEY=<its token>
#
# Wye alone does not protect a public endpoint: per-user authentication and
# quotas stay in the services. `wye policy-test -c wye.toml` runs the cases
# in policy-tests/.

[server]
listen = "0.0.0.0:8080"
drain_delay_secs = 10

# Anthropic first; Claude Platform on AWS takes a request only when Anthropic
# rejects it (rate limit, overload, or a failed connection), before any output.
[routes.claude]
select = "ordered"
failover = ["429", "529", "connect"]

[[routes.claude.upstreams]]
id = "anthropic"
base_url = "https://api.anthropic.com"
provider_key_env = "ANTHROPIC_API_KEY"

[[routes.claude.upstreams]]
id = "aws-us-west-2"
provider = "claude-platform-aws"
workspace_id = "wrkspc_01AbCdEf23GhIj"
base_url = "https://aws-external-anthropic.us-west-2.api.aws"
provider_key_env = "CLAUDE_PLATFORM_AWS_KEY"

# The search service ranks results with OpenAI Responses.
[routes.openai]
[[routes.openai.upstreams]]
id = "openai"
base_url = "https://api.openai.com"
provider_key_env = "OPENAI_API_KEY"

[auth]
issuer = "wye"
audience = "acme-app"
models = ["claude-sonnet-*", "claude-haiku-*", "gpt-5.5*"]
# No reply in this product needs more; a runaway loop costs at most this.
max_output_tokens = 8192
# Replace with yours: `wye token keygen` prints it. This one's private key
# was thrown away, so as shipped it accepts no Wye token.
[[auth.signing_keys]]
id = "2026-11"
ed25519_public_key = "aQ9XgUgWKBcTnh-PPc3eqIbxm_QjQY9G86jKJCHrgDM"

# Services ask for what a request is for; this file decides the model. A
# model upgrade is one reviewed change here: the canary deployment of the
# support bot moves first, and its usage records show the difference.
[[aliases]]
name = "support-reply"
model = "claude-sonnet-5"
when = [{ subjects = ["support-bot-canary"], model = "claude-sonnet-5-5" }]

[[aliases]]
name = "ticket-summary"
model = "claude-haiku-5-5"

# Before the stable support bot moves to Sonnet 5.5: which of its requests
# would Sonnet 5.5 reject? Read upgrade_issues in the usage records or
# `wye report`.
[upgrade_check]
targets = ["claude-sonnet-5-5"]

[pricing]
version = "anthropic-2026-11-01"

[[pricing.prices]]
models = ["claude-sonnet-5-5"]
input = "2.00"
output = "10.00"
cache_read = "0.10"
cache_write_5m = "2.50"
cache_write_1h = "4.00"

[[pricing.prices]]
models = ["claude-sonnet-5"]
input = "2.00"
output = "10.00"
cache_read = "0.20"
cache_write_5m = "2.50"
cache_write_1h = "4.00"

[[pricing.prices]]
models = ["claude-haiku-5-5"]
input = "0.10"
output = "0.50"
# gpt-5.5 has no entry yet, so its requests cost "unknown", never $0.

[telemetry]
otlp_endpoint = "http://otel-collector:4318"
service_name = "wye-app"
