# Config for the sample policy tests: `wye policy-test -c wye.toml .`
[server]
listen = "0.0.0.0:8080"

[upstream]
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"

[auth]
issuer = "wye"
audience = "wye-prod"
models = ["claude-sonnet-*", "claude-haiku-*"]
[[auth.keys]]
id = "k1"
ed25519_public_key = "11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo"

# Services ask for "coding"; config decides the model. The canary team moves first.
[[aliases]]
name = "coding"
model = "claude-sonnet-5-5"
when = [{ subjects = ["team-canary-*"], model = "claude-haiku-5-5" }]
