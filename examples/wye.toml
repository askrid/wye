# Minimal Wye configuration for Claude Code.
#
#   ANTHROPIC_API_KEY=... wye serve --config examples/wye.toml
#   ANTHROPIC_BASE_URL=http://127.0.0.1:8080 claude

[server]
listen = "127.0.0.1:8080"
# max_request_body_bytes = 33554432
# Requests in flight before new ones get an overload (529) error:
# max_concurrent_requests = 10000
# Behind a load balancer: keep serving with /readyz failing this long after
# SIGTERM, so traffic moves away before connections are refused.
# drain_delay_secs = 0
# shutdown_grace_secs = 30

[upstream]
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
# For a claude.ai subscription login, use this instead of api_key_env:
# forward_caller_credential = true
# connect_timeout_secs = 10
# response_header_timeout_secs = 600
# stream_idle_timeout_secs = 120
# PEM file of extra trusted root certificates (e.g. a TLS-inspecting proxy):
# ca_file = "corporate-ca.pem"

# Gateway credentials. Required to listen beyond loopback; incompatible with
# forward_caller_credential. Create a signing key and credentials offline:
#   wye token keygen --out issuer.key
#   wye token issue --key issuer.key --kid k1 --issuer wye --audience wye-prod \
#     --subject alice --ttl-secs 86400
# Claude Code sends the credential with ANTHROPIC_AUTH_TOKEN (or ANTHROPIC_API_KEY).
# [auth]
# issuer = "wye"
# audience = "wye-prod"
# max_credential_ttl_secs = 604800
# [[auth.keys]]
# id = "k1"
# ed25519_public_key = "<printed by wye token keygen>"

# Cache-miss diagnostics: keyed hashes of the prompt sections in each usage
# record, so a telemetry backend can tell why a prompt-cache read missed
# (docs/research.md, "Cache-miss diagnostics"). The key is required and must be
# the same on every replica; generate one with `openssl rand -hex 32`.
# Scanning costs CPU per uploaded MB; sample_percent diagnoses that share of
# Claude Code sessions, each one completely, chosen alike on every replica.
# [cache_diagnostics]
# hash_key_env = "WYE_CACHE_HASH_KEY"
# sample_percent = 100
