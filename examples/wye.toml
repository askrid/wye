# Wye configuration reference: every field, with its default and limits.
# As it stands, this file runs Claude Code with one Anthropic API key. The
# fields of its two live sections are set to their defaults, so every field
# shows; the optional sections and the alternatives stay commented out, since
# turning one on changes what Wye does. On a claude.ai subscription, start
# from examples/developer/wye.toml instead.
#
#   ANTHROPIC_API_KEY=... wye serve -c examples/wye.toml
#   wye claude                  # or: ANTHROPIC_BASE_URL=http://127.0.0.1:8080 claude
#
# Only `listen`, `base_url`, and a provider key (or forward_caller_credential)
# are required. Unknown fields are an error at startup, and so are timers over
# 86400 seconds (a day).
# Paths are relative to this file. Secrets are never written here: they come
# from environment variables or files.

[server]
listen = "127.0.0.1:8080"              # beyond loopback only with [auth]
max_request_body_bytes = 33554432      # Anthropic's request size limit
# Request bytes held while Wye reads `model` (the hold), all requests
# together; beyond it, an overload error. A chunk counts at least 1 KiB, for
# the memory it pins. At least max_request_body_bytes, since one body may be
# held whole:
max_total_held_bytes = 67108864
# Request bytes kept so failover can resend them, all requests together;
# beyond it, a request goes without failover, never refused. A chunk counts at
# least 1 KiB:
max_total_kept_bytes = 268435456
# Requests in flight before new ones get an overload error (529 on the
# Messages API, 503 on the OpenAI APIs):
max_concurrent_requests = 10000
# Behind a load balancer: keep serving with /readyz failing this long after
# SIGTERM, so traffic moves away before connections are refused:
drain_delay_secs = 0
shutdown_grace_secs = 30               # then remaining requests are cancelled
# A client that accepts no response bytes this long is disconnected, which
# cancels its upstream request and frees its buffers:
client_write_timeout_secs = 60

# A single upstream (one Anthropic account): the short form of a
# [routes.claude] with one upstream, and the only form that can forward each
# caller's credential.
[upstream]
base_url = "https://api.anthropic.com" # without /v1; http only for loopback hosts
provider_key_env = "ANTHROPIC_API_KEY"
# Or read the provider key from a mounted secret file (Docker or Kubernetes
# secrets, systemd credentials):
# provider_key_file = "/run/secrets/anthropic_api_key"
# Or forward each caller's own credential: a claude.ai login, or an API key,
# which bills the API (loopback only, no [auth]; `wye init` writes this):
# forward_caller_credential = true
connect_timeout_secs = 10              # TCP and the TLS handshake together
# Non-streaming generations send no headers until they finish:
response_header_timeout_secs = 600
# Longer than the provider's SSE ping interval:
stream_idle_timeout_secs = 120
# "auto" negotiates HTTP/2 when the upstream offers it; "1.1" avoids HTTP/2
# flow control on large uploads at the cost of one connection per request:
http_version = "auto"
# PEM file of extra trusted root certificates (a TLS-inspecting proxy):
# ca_file = "corporate-ca.pem"

# Several accounts or providers, one upstream each, instead of [upstream].
# Each Claude Code session stays on one upstream, chosen from the session id
# the same way on every replica, so its prompt cache stays warm.
# [routes.claude]
# "cache_affine" spreads sessions by weight; "ordered" uses the first
# upstream and the others only on failover:
# select = "cache_affine"
# A request the upstream rejects (rate limit, overload, or a connection
# refused or cut before the body was sent whole) goes to the session's next
# upstream in the same turn; never after a response byte:
# failover = ["429", "529", "connect"]
# failover_max_body_bytes = 8388608    # larger bodies go without failover
#
# Up to 16 upstreams. Each takes every [upstream] field above except
# forward_caller_credential.
# [[routes.claude.upstreams]]
# id = "team-a"                        # required and unique; in usage records and OTLP
# provider = "anthropic"               # the default
# weight = 2                           # share of sessions, 1 to 1000; default 1
# base_url = "https://api.anthropic.com"
# provider_key_env = "ANTHROPIC_KEY_TEAM_A"
#
# [[routes.claude.upstreams]]
# id = "aws-us-west-2"
# provider = "claude-platform-aws"     # the provider key goes as a bearer token
# workspace_id = "wrkspc_01AbCdEf23GhIj"   # required for this provider
# base_url = "https://aws-external-anthropic.us-west-2.api.aws"
# provider_key_env = "CLAUDE_PLATFORM_AWS_KEY"
#
# [[routes.claude.upstreams]]
# id = "bedrock-us-east-1"
# provider = "bedrock"                 # model ids go upstream as anthropic.<model>
# base_url = "https://bedrock-mantle.us-east-1.api.aws/anthropic"
# provider_key_env = "BEDROCK_API_KEY"

# OpenAI Responses and Chat Completions, for Codex (`wye codex`) and the
# OpenAI SDKs, beside or instead of the Claude route. Clients use base URL
# http://<gateway>/v1; the provider key goes upstream as
# Authorization: Bearer. Several upstreams, `select`, `weight`, and
# `failover` work as above.
# [routes.openai]
# [[routes.openai.upstreams]]
# id = "openai"
# provider = "openai"                  # the default here
# base_url = "https://api.openai.com"  # without /v1
# provider_key_env = "OPENAI_API_KEY"

# Gateway tokens; incompatible with forward_caller_credential. `wye init
# --shared` writes this section and a signing key; issue gateway tokens with
# it offline:
#   wye token issue alice --ttl 1d
# Claude Code sends one with ANTHROPIC_AUTH_TOKEN (or ANTHROPIC_API_KEY).
# [auth]
# issuer = "wye"
# audience = "wye-prod"
# max_gateway_token_ttl_secs = 604800  # longest accepted exp - iat: one week
# Model permissions: the models any gateway token may use (exact names, or
# prefixes ending in *); a gateway token issued with --models narrows this
# further. Omit to allow all:
# models = ["claude-sonnet-*", "claude-haiku-*"]
# Output-token ceiling: the largest output-token value a request may ask for
# (max_tokens, max_output_tokens, or max_completion_tokens per API)
# (gateway tokens issued with --max-output-tokens can only lower it):
# max_output_tokens = 32000
# Below the [auth] fields: in TOML, every key after a table header belongs
# to that table.
# [[auth.signing_keys]]
# id = "k1"
# ed25519_public_key = "<printed by wye token keygen>"
#
# Identity-provider tokens, verified directly: CI workload identity or the
# team's IdP (through Claude Code's apiKeyHelper). Commit the IdP's JWKS next
# to this file (for GitHub Actions:
# https://token.actions.githubusercontent.com/.well-known/jwks) and update it
# when the IdP rotates keys; Wye never fetches it. With identity providers,
# the issuer, audience, and [[auth.signing_keys]] above are optional.
# [[auth.identity_providers]]
# issuer = "https://token.actions.githubusercontent.com"
# audience = "wye-prod"
# algorithm = "RS256"                  # or ES256, EdDSA; pinned, never read from the token
# jwks_file = "github.jwks"            # read at startup
# subject_claim = "repository"         # names the subject; default "sub"
# Models by claim value (a string claim equal to value, or a list containing
# it). An identity-provider token matching no grant may use no model; omit
# grants to leave [auth] models in charge.
# [[auth.identity_providers.grants]]
# claim = "repository_owner"
# value = "acme"
# models = ["claude-haiku-*"]

# Cache diagnostics: keyed hashes of a request's prompt sections, naming which
# section changed before a cache miss (docs/architecture.md, "Cache
# diagnostics"). Scanning adds CPU time per uploaded MB; sample_percent
# diagnoses that share of Claude Code sessions, each completely. The key
# (required, at least 32 bytes: `openssl rand -hex 32`) and the sample are the
# same on every replica.
# [cache_diagnostics]
# hash_key_env = "WYE_CACHE_HASH_KEY"
# sample_percent = 100

# Usage records as OTLP logs, metrics, and per-session traces (OTLP/HTTP,
# JSON) to a collector or an OpenTelemetry backend that accepts OTLP
# directly, at {otlp_endpoint}/v1/logs, /v1/metrics, and /v1/traces. Records
# also stay in the usage log.
# [telemetry]
# otlp_endpoint = "http://localhost:4318"  # no credentials in the URL
# otlp_headers_env = "OTLP_HEADERS"    # extra headers, "key=value,key2=value2": the API key goes here
# service_name = "wye"

# Model catalog for GET /v1/models (absent without this section): Claude
# Code's /model picker lists these when developers set
# CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY=1. Up to 1000 models; each
# caller sees only those its gateway token may use. Claude Code keeps ids
# that contain "claude" or "anthropic".
# [discovery]
# models = [
#   { id = "claude-sonnet-5-5", display_name = "Claude Sonnet 5.5", description = "Everyday coding" },
#   { id = "claude-haiku-5-5" },       # display_name and description are optional
# ]

# Model aliases (up to 256): clients send an alias name, config decides the
# model, and a model upgrade is one reviewed change here. Model permissions
# apply to the served model; usage records show both (requested_model,
# model). `when` rules (up to 32, first match by subject) move matching
# subjects first. Name an alias Claude Code should list as [discovery] says
# above.
# [[aliases]]
# name = "claude-coding"
# model = "claude-opus-5-5"
# when = [{ subjects = ["team-canary-*"], model = "claude-sonnet-5-5" }]

# The price table, so every usage record carries its cost. Copy prices from
# the provider's pricing page. USD per million tokens as decimal strings, at
# most 6 decimals. Up to 256 entries, matched by the model the provider
# reported: entries scoped to the serving upstream first, then the first
# unscoped match. A model no entry matches costs "unknown", never $0 (rules:
# docs/policy.md, "Price table").
# [pricing]
# version = "anthropic-2026-11-01"     # recorded with every cost
# [[pricing.prices]]
# models = ["claude-opus-5-5"]
# upstreams = ["aws-us-west-2"]        # only for these route upstreams (partner or regional prices)
# input = "4.00"
# output = "20.00"
# cache_read = "0.20"                  # optional, like the cache writes below
# cache_write_5m = "5.00"
# cache_write_1h = "8.00"
#
# [[pricing.prices]]
# models = ["claude-haiku-5-5"]
# input = "0.10"
# output = "0.50"
# Up to 8 tiers per entry: prices above a prompt length (input plus cache
# reads and writes), the rest inherited from the entry:
# [[pricing.prices.tiers]]
# above_prompt_tokens = 100000
# input = "0.50"
# output = "2.50"

# Upgrade checks: before an alias or a client moves to a newer model, report
# which requests that model would reject (a manual thinking budget, forced
# tool_choice, prefill, ...). Anthropic Messages requests only. Report only;
# requests are never changed.
# Results: upgrade_issues in usage records, wye.upgrade.issues in OTLP,
# `wye report`, and `wye explain --config wye.toml --target-model <model> request.json`.
# [upgrade_check]
# targets = ["claude-opus-5-5"]        # up to 16 models
# sample_percent = 100                 # share of sessions (or clients) checked; lower it on busy fleets
