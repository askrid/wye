# Wye configuration for Claude Code with an Anthropic API key, with every
# option shown. On a claude.ai subscription, use examples/subscription.toml.
#
#   ANTHROPIC_API_KEY=... wye serve --config examples/wye.toml
#   wye claude                  # or: ANTHROPIC_BASE_URL=http://127.0.0.1:8080 claude

[server]
listen = "127.0.0.1:8080"
# max_request_body_bytes = 33554432
# Request bytes held while reading `model` for model permissions, all requests together:
# max_held_request_bytes = 67108864
# Requests in flight before new ones get an overload (529) error:
# max_concurrent_requests = 10000
# Behind a load balancer: keep serving with /readyz failing this long after
# SIGTERM, so traffic moves away before connections are refused.
# drain_delay_secs = 0
# shutdown_grace_secs = 30
# A client that accepts no response bytes this long is disconnected, which
# cancels its upstream request and frees its buffers:
# client_write_timeout_secs = 60

[upstream]
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
# Or read the key from a mounted secret file (Docker/Kubernetes secrets,
# systemd credentials), relative to this file:
# api_key_file = "/run/secrets/anthropic_api_key"
# For a claude.ai subscription login, use this instead of api_key_env
# (examples/subscription.toml is a complete config):
# forward_caller_credential = true
# connect_timeout_secs = 10
# response_header_timeout_secs = 600
# stream_idle_timeout_secs = 120
# "auto" negotiates HTTP/2 when the upstream offers it; "1.1" avoids HTTP/2
# flow control on large uploads at the cost of one connection per request:
# http_version = "auto"
# PEM file of extra trusted root certificates (e.g. a TLS-inspecting proxy):
# ca_file = "corporate-ca.pem"

# Gateway credentials. Required to listen beyond loopback; incompatible with
# forward_caller_credential. Create a signing key and credentials offline:
#   wye token keygen --out issuer.key
#   wye token issue --key issuer.key --kid k1 --issuer wye --audience wye-prod \
#     --subject alice --ttl-secs 86400
# Claude Code sends the credential with ANTHROPIC_AUTH_TOKEN (or ANTHROPIC_API_KEY).
# [auth]
# issuer = "wye"
# audience = "wye-prod"
# max_credential_ttl_secs = 604800
# Models any credential may use (exact names or prefixes ending in *); a
# credential issued with --models narrows this further. Omit to allow all.
# models = ["claude-sonnet-*", "claude-haiku-*"]
# Largest max_tokens a request may ask for (credentials issued with
# --max-output-tokens can only lower it):
# max_output_tokens = 32000
# [[auth.keys]]
# id = "k1"
# ed25519_public_key = "<printed by wye token keygen>"
#
# Identity-provider tokens, verified directly: CI workload identity or the
# team's IdP (through Claude Code's apiKeyHelper). Commit the provider's JWKS
# next to this file (for GitHub Actions:
# https://token.actions.githubusercontent.com/.well-known/jwks) and update it
# when the provider rotates keys; Wye never fetches it. With issuers, the
# issuer/audience/[[auth.keys]] above are optional.
# [[auth.issuers]]
# issuer = "https://token.actions.githubusercontent.com"
# audience = "wye-prod"
# algorithm = "RS256"                 # or ES256, EdDSA
# jwks_file = "github.jwks"
# subject_claim = "repository"        # default "sub"
# Models by claim value (a string claim equal to value, or a list containing
# it). Tokens matching no grant may use no model; omit grants to leave the
# [auth] models ceiling in charge.
# [[auth.issuers.grants]]
# claim = "repository_owner"
# value = "acme"
# models = ["claude-haiku-*"]

# Cache-miss diagnostics: keyed hashes of the prompt sections in each usage
# record, so a telemetry backend can tell why a prompt-cache read missed
# (docs/research.md, "Cache-miss diagnostics"). The key is required and must be
# the same on every replica; generate one with `openssl rand -hex 32`.
# Scanning costs CPU per uploaded MB; sample_percent diagnoses that share of
# Claude Code sessions, each one completely, chosen alike on every replica.
# [cache_diagnostics]
# hash_key_env = "WYE_CACHE_HASH_KEY"
# sample_percent = 100

# Usage records as OTLP logs, aggregated metrics, and per-session traces
# (OTLP/HTTP, JSON) to a collector or a backend that accepts OTLP directly.
# Records also stay in the stderr log.
# [telemetry]
# otlp_endpoint = "http://localhost:4318"
# otlp_headers_env = "OTLP_HEADERS"   # e.g. "api-key=..." for a hosted backend
# service_name = "wye"

# Model catalog for GET /v1/models: Claude Code's /model picker lists these
# when developers set CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY=1. Each caller
# sees only the models its credential may use. Claude Code keeps ids that
# contain "claude" or "anthropic".
# [discovery]
# models = [
#   { id = "claude-sonnet-5-5", display_name = "Claude Sonnet 5.5", description = "Everyday coding" },
#   { id = "claude-haiku-5-5" },
# ]

# Model aliases: clients ask for a stable name, config decides the model, and
# a model upgrade is one reviewed change here. Permissions apply to the model
# that runs; usage records show both (requested_model, model). `when` rules
# move matching credential subjects first. Claude Code's /model picker lists
# only ids containing "claude", so name aliases it should show accordingly.
# [[aliases]]
# name = "claude-coding"
# model = "claude-opus-5-5"
# when = [{ subjects = ["team-canary-*"], model = "claude-sonnet-5-5" }]
