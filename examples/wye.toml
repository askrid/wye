# Wye configuration reference: every field, with its default and limits.
# As it stands, this file runs Claude Code with one Anthropic API key. Live
# sections set every field to its default; optional sections and alternatives
# are commented out, since each changes what Wye does. On a claude.ai
# subscription, start from examples/developer/wye.toml instead.
#
#   ANTHROPIC_API_KEY=... wye serve -c examples/wye.toml
#   wye claude                  # or: ANTHROPIC_BASE_URL=http://127.0.0.1:8080 claude
#
# Only a provider key (or forward_caller_credential) is required, and a
# base_url for providers whose URL names a region (claude-platform-aws,
# bedrock). Unknown fields are an error at startup.
# Durations are a whole number and a unit: "30s", "10m", "8h", "7d"; timers
# are at most "1d".
# Paths are relative to this file. Secrets are never written here: each is
# { env = "NAME" }, an environment variable, or { file = "path" }, a file
# readable only by its owner (`wye doctor` fails, and `serve` warns, when
# group or others may open it), read once at startup.

[server]
# Beyond loopback only with [auth]. Without [auth], every local user and
# program may use the gateway, but no web page: requests need a loopback Host
# (localhost, 127.0.0.1, [::1]) and no Origin (docs/policy.md). The address
# `wye claude`, `wye codex`, and `wye probe` use unless told another:
listen = "127.0.0.1:8080"
# Anthropic's request size limit. Request bytes held while Wye reads `model`
# (the hold), all requests together, are at most twice this, so one body may
# be held whole; beyond it, an overload error. The other memory bounds are
# fixed (docs/policy.md, "Local resource bounds"):
max_request_body_bytes = 33554432
# Requests in flight before new ones get an overload error (529 on the
# Messages API, 503 on the OpenAI APIs). Open client connections, idle ones
# included, are at most twice this; at the limit, new connections wait in
# the kernel's listen queue until one closes. Needs an open-file limit about
# four times this (docs/operations.md, "Running as a service"):
max_concurrent_requests = 10000
# Behind a load balancer: keep serving with /readyz failing this long after
# SIGTERM, so traffic moves away before connections are refused:
drain_delay = "0s"
shutdown_grace = "30s"                 # then remaining requests are cancelled

# The Claude route: Anthropic Messages, for Claude Code and the Anthropic
# SDKs. Here one upstream, one Anthropic account; several accounts or
# providers are one upstream each (below). Each Claude Code session stays on
# one upstream, chosen from the session id the same way on every replica, so
# its prompt cache stays warm. With two or more upstreams, a request the
# upstream rejects before processing it (429, 529, or a connection refused
# or cut before the body was sent whole) goes to the session's next upstream
# in the same turn: never after a response byte, and never a body over
# 8 MiB.
[routes.claude]
# "cache_affine" spreads sessions by weight; "ordered" uses the first
# upstream and the others only on failover:
select = "cache_affine"

# Up to 16 upstreams, one [[routes.claude.upstreams]] entry each.
[[routes.claude.upstreams]]
# Names the upstream in usage records, OTLP, and prices; unique. Default:
# the provider's name ("anthropic"); required when two upstreams of a route
# share a provider:
# id = "main"
provider = "anthropic"                 # or "claude-platform-aws", "bedrock" (below)
weight = 1                             # share of sessions, 1 to 1000
# Without /v1; http only for loopback hosts. Default: the provider's API
# for anthropic (this) and openai; claude-platform-aws and bedrock name a
# region, so set it:
base_url = "https://api.anthropic.com"
provider_key = { env = "ANTHROPIC_API_KEY" }
# Or from a mounted secret file (Docker or Kubernetes secrets, systemd
# credentials, or one next to this config, as `wye init` writes it):
# provider_key = { file = "/run/secrets/anthropic_api_key" }
# Or forward each caller's own credential: a claude.ai login, or an API key,
# which bills the API (a route with one upstream, loopback only, no [auth];
# `wye init` writes this):
# forward_caller_credential = true
connect_timeout = "10s"                # TCP and the TLS handshake together
# Non-streaming generations send no headers until they finish:
response_header_timeout = "10m"
# Longer than the provider's SSE ping interval:
stream_idle_timeout = "2m"
# "auto" negotiates HTTP/2 when the upstream offers it; "1.1" avoids HTTP/2
# flow control on large uploads at the cost of one connection per request:
http_version = "auto"
# PEM file of extra trusted root certificates (a TLS-inspecting proxy):
# ca_file = "corporate-ca.pem"

# Several accounts or providers: one more entry each, with an id where two
# share a provider. Each takes every field above except
# forward_caller_credential.
# [[routes.claude.upstreams]]
# id = "team-a"
# weight = 2
# base_url = "https://api.anthropic.com"
# provider_key = { env = "ANTHROPIC_KEY_TEAM_A" }
#
# [[routes.claude.upstreams]]
# id = "aws-us-west-2"
# provider = "claude-platform-aws"     # the provider key goes as a bearer token
# workspace_id = "wrkspc_01AbCdEf23GhIj"   # required for this provider
# base_url = "https://aws-external-anthropic.us-west-2.api.aws"
# provider_key = { env = "CLAUDE_PLATFORM_AWS_KEY" }
#
# [[routes.claude.upstreams]]
# id = "bedrock-us-east-1"
# provider = "bedrock"                 # model ids go upstream as anthropic.<model>
# base_url = "https://bedrock-mantle.us-east-1.api.aws/anthropic"
# provider_key = { env = "BEDROCK_API_KEY" }

# OpenAI Responses and Chat Completions, for Codex (`wye codex`) and the
# OpenAI SDKs, beside or instead of the Claude route. Clients use base URL
# http://<gateway>/v1; the provider key goes upstream as
# Authorization: Bearer. Several upstreams, `select`, `weight`, and
# failover work as above.
# [routes.openai]
# [[routes.openai.upstreams]]
# provider = "openai"                  # the default here
# base_url = "https://api.openai.com"  # the default here; without /v1
# provider_key = { env = "OPENAI_API_KEY" }

# Gateway tokens; incompatible with forward_caller_credential. `wye init
# --shared` writes this section and a signing key; issue gateway tokens with
# it offline, away from the hosts that serve (`serve` never reads the key):
#   wye token issue alice --ttl 1d
# Claude Code sends one with ANTHROPIC_AUTH_TOKEN (or ANTHROPIC_API_KEY).
# [auth]
# The aud of Wye's own gateway tokens; give each gateway its own. Their iss
# is always "wye":
# audience = "wye-prod"
# Ed25519 public keys that verify Wye's own gateway tokens, as `wye token
# keygen` prints them; several during a rotation. A token names its key by
# the key's JWK thumbprint (RFC 7638), which `wye explain` shows:
# signing_keys = ["<printed by wye token keygen>"]
# Longest accepted exp - iat: one week; at most "30d", since a gateway token
# cannot be revoked before it expires:
# max_gateway_token_ttl = "7d"
# Model permissions: the models any gateway token may use (exact names, or
# prefixes ending in *); a gateway token issued with --models narrows this
# further. Omit to allow all:
# models = ["claude-sonnet-*", "claude-haiku-*"]
# Output-token ceiling: the largest output-token value a request may ask for
# max_tokens, max_output_tokens, or max_completion_tokens, per API; a gateway
# token issued with --max-output-tokens can only lower it:
# max_output_tokens = 32000
#
# Identity-provider tokens, verified directly: CI workload identity or the
# team's IdP (through Claude Code's apiKeyHelper). Commit the IdP's JWKS next
# to this file (for GitHub Actions:
# https://token.actions.githubusercontent.com/.well-known/jwks) and update it
# when the IdP rotates keys; Wye never fetches it. With identity providers,
# audience and signing_keys above are optional. Below the [auth] fields: in
# TOML, every key after a table header belongs to that table.
# [[auth.identity_providers]]
# issuer = "https://token.actions.githubusercontent.com"
# audience = "wye-prod"
# algorithm = "RS256"                  # or ES256, EdDSA; never read from the token
# jwks_file = "github.jwks"            # read at startup
# subject_claim = "repository"         # names the subject; default "sub"
# Models by claim value (a string claim equal to value, or a list containing
# it). An identity-provider token matching no grant may use no model; omit
# grants to leave [auth] models in charge.
# [[auth.identity_providers.grants]]
# claim = "repository_owner"
# value = "acme"
# models = ["claude-haiku-*"]

# Cache diagnostics: keyed hashes of a request's prompt sections, naming which
# section changed before a cache miss (docs/architecture.md, "Cache
# diagnostics"). Scanning adds CPU time per uploaded MB; sample_percent
# diagnoses that share of Claude Code sessions, each completely. The key
# (required, at least 32 bytes: `openssl rand -hex 32`) and sample_percent
# must match on every replica. The key, like every secret, is { env } or
# { file }:
# [cache_diagnostics]
# hash_key = { env = "WYE_CACHE_HASH_KEY" }
# sample_percent = 100

# Usage records as OTLP logs, metrics, and per-session traces (OTLP/HTTP,
# JSON) to a collector or an OpenTelemetry backend that accepts OTLP
# directly, at {otlp_endpoint}/v1/logs, /v1/metrics, and /v1/traces. Records
# also stay in the usage log. Plain http only to a loopback host, as for
# base_url: beyond this machine, records and OTLP headers need https.
# [telemetry]
# otlp_endpoint = "http://localhost:4318"  # no credentials in the URL
# otlp_headers = { env = "OTLP_HEADERS" }  # "key=value,...": a backend's API key
# service_name = "wye"

# Model catalog for GET /v1/models (absent without this section): Claude
# Code's /model picker lists these when developers set
# CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY=1. Up to 1000 models; each
# caller sees only those its gateway token may use. Claude Code keeps ids
# that contain "claude" or "anthropic".
# [discovery]
# models = [
#   { id = "claude-sonnet-5-5", display_name = "Claude Sonnet 5.5", description = "Everyday coding" },
#   { id = "claude-haiku-5-5" },       # display_name and description are optional
# ]

# Model aliases (up to 256): clients send an alias name, config decides the
# model, and a model upgrade is one reviewed change here. Model permissions
# apply to the served model; usage records show both (requested_model,
# model). `when` rules (up to 32, first match by subject) move matching
# subjects first. Claude Code's picker lists only names containing "claude"
# or "anthropic".
# [[aliases]]
# name = "claude-coding"
# model = "claude-sonnet-5"
# when = [{ subjects = ["team-canary-*"], model = "claude-sonnet-5-5" }]

# The price table, so every usage record carries its cost. Copy prices from
# the provider's pricing page. USD per million tokens as decimal strings, at
# most 6 decimals. Up to 256 entries, matched by the model the provider
# reported: entries scoped to the serving upstream first, then the first
# unscoped match. A model no entry matches costs "unknown", never $0 (rules:
# docs/policy.md, "Price table").
# [pricing]
# Recorded with every cost. Default: 16 hex digits of a hash of the prices
# below, the same on every replica and changed by any price:
# version = "anthropic-2026-11-01"
# [[pricing.prices]]
# models = ["claude-opus-5-5"]
# upstreams = ["aws-us-west-2"]        # only when one of these serves (regional prices)
# input = "4.00"
# output = "20.00"
# cache_read = "0.20"                  # optional, like the cache writes below
# cache_write_5m = "5.00"
# cache_write_1h = "8.00"
#
# [[pricing.prices]]
# models = ["claude-haiku-5-5"]
# input = "0.10"
# output = "0.50"
# Up to 8 tiers per entry: prices above a prompt length (input plus cache
# reads and writes), the rest inherited from the entry:
# [[pricing.prices.tiers]]
# above_prompt_tokens = 100000
# input = "0.50"
# output = "2.50"

# Upgrade checks: before an alias or a client moves to a newer model, report
# which requests that model would reject (a manual thinking budget, forced
# tool_choice, prefill, ...). Anthropic Messages requests only. Report only;
# requests are never changed.
# Results: upgrade_issues in usage records, wye.upgrade.issues in OTLP,
# `wye report`, and `wye explain --config wye.toml --target-model <model> request.json`.
# [upgrade_check]
# targets = ["claude-sonnet-5-5"]      # up to 16 models
# sample_percent = 100                 # share of sessions (or clients) checked
