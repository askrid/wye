# Wye configuration reference: every option, with its default and limits.
# As it stands, this file runs Claude Code with one Anthropic API key; every
# other section is commented out. On a claude.ai subscription, start from
# examples/subscription.toml instead.
#
#   ANTHROPIC_API_KEY=... wye serve -c examples/wye.toml
#   wye claude                  # or: ANTHROPIC_BASE_URL=http://127.0.0.1:8080 claude
#
# Only `listen`, `base_url`, and one credential are required. Unknown fields
# are rejected at startup, and so are timers over 86400 seconds (a day).
# Paths are relative to this file. Secrets are never written here: they come
# from environment variables or files.

[server]
listen = "127.0.0.1:8080"              # beyond loopback only with [auth]
# max_request_body_bytes = 33554432    # Anthropic's request size limit
# Request bytes held while reading `model` (for permissions, aliases, and a
# provider's model id), all requests together; beyond it, an overload error.
# A chunk counts at least 1 KiB, for the memory it pins. A client that sends
# nothing for 60 s while held gets 408. At least max_request_body_bytes,
# since one body may be held whole:
# max_held_request_bytes = 67108864
# Requests in flight before new ones get an overload error (529 on the
# Messages API, 503 on the OpenAI APIs):
# max_concurrent_requests = 10000
# Behind a load balancer: keep serving with /readyz failing this long after
# SIGTERM, so traffic moves away before connections are refused:
# drain_delay_secs = 0
# shutdown_grace_secs = 30             # then remaining requests are cancelled
# A client that accepts no response bytes this long is disconnected, which
# cancels its upstream request and frees its buffers:
# client_write_timeout_secs = 60

# One Anthropic upstream. For several accounts or providers, use
# [routes.claude] below instead.
[upstream]
base_url = "https://api.anthropic.com" # without /v1; http only for loopback hosts
api_key_env = "ANTHROPIC_API_KEY"
# Or read the key from a mounted secret file (Docker or Kubernetes secrets,
# systemd credentials):
# api_key_file = "/run/secrets/anthropic_api_key"
# Or forward each caller's own credential, for a claude.ai subscription login
# (loopback only, no [auth]; examples/subscription.toml is a complete config):
# forward_caller_credential = true
# connect_timeout_secs = 10           # TCP and the TLS handshake together
# Non-streaming generations send no headers until they finish:
# response_header_timeout_secs = 600
# Longer than the provider's SSE ping interval:
# stream_idle_timeout_secs = 120
# "auto" negotiates HTTP/2 when the upstream offers it; "1.1" avoids HTTP/2
# flow control on large uploads at the cost of one connection per request:
# http_version = "auto"
# PEM file of extra trusted root certificates (a TLS-inspecting proxy):
# ca_file = "corporate-ca.pem"

# Several accounts or providers, instead of [upstream]. Each Claude Code
# session stays on one account (its prompt cache stays warm), chosen from the
# session id the same way on every replica.
# [routes.claude]
# "cache_affine" spreads sessions by weight; "ordered" uses the first
# upstream and the others only on failover:
# select = "cache_affine"
# A request refused before it was processed (rate limit, overload, a
# connection refused or cut before the body was sent whole) goes to the
# session's next upstream in the same turn; never after a response byte:
# failover = ["429", "529", "connect"]
# failover_max_body_bytes = 8388608    # larger bodies go without failover
# failover_max_held_bytes = 268435456  # bodies kept for resending, across the process (a chunk counts at least 1 KiB)
#
# Up to 16 upstreams. Each takes every [upstream] field above except
# forward_caller_credential.
# [[routes.claude.upstreams]]
# id = "team-a"                        # required and unique; in usage records and OTLP
# provider = "anthropic"               # the default
# weight = 2                           # share of sessions, 1 to 1000; default 1
# base_url = "https://api.anthropic.com"
# api_key_env = "ANTHROPIC_KEY_TEAM_A"
#
# [[routes.claude.upstreams]]
# id = "aws-us-west-2"
# provider = "claude-platform-aws"     # the key goes as a bearer token
# workspace_id = "wrkspc_01AbCdEf23GhIj"   # required for this provider
# base_url = "https://aws-external-anthropic.us-west-2.api.aws"
# api_key_env = "CLAUDE_PLATFORM_AWS_KEY"
#
# [[routes.claude.upstreams]]
# id = "bedrock-us-east-1"
# provider = "bedrock"                 # model ids go upstream as anthropic.<model>
# base_url = "https://bedrock-mantle.us-east-1.api.aws/anthropic"
# api_key_env = "BEDROCK_API_KEY"

# OpenAI Responses and Chat Completions, for Codex (`wye codex`) and the
# OpenAI SDKs, beside or instead of the Claude route. Clients use base URL
# http://<gateway>/v1; the key goes upstream as Authorization: Bearer.
# Several accounts, `select`, `weight`, and `failover` work as above.
# [routes.openai]
# [[routes.openai.upstreams]]
# id = "openai"
# provider = "openai"                  # the default here
# base_url = "https://api.openai.com"  # without /v1
# api_key_env = "OPENAI_API_KEY"

# Gateway credentials. Required to listen beyond loopback; incompatible with
# forward_caller_credential. `wye init --auth` writes this section and a
# signing key; tokens are issued offline with the key:
#   wye token issue alice --ttl 1d
# Claude Code sends the credential with ANTHROPIC_AUTH_TOKEN (or ANTHROPIC_API_KEY).
# [auth]
# issuer = "wye"
# audience = "wye-prod"
# max_credential_ttl_secs = 604800     # longest accepted exp - iat: one week
# Models any credential may use (exact names, or prefixes ending in *); a
# credential issued with --models narrows this further. Omit to allow all:
# models = ["claude-sonnet-*", "claude-haiku-*"]
# Output-token ceiling: the largest output-token value a request may ask for
# (max_tokens, max_output_tokens, or max_completion_tokens per API)
# (credentials issued with --max-output-tokens can only lower it):
# max_output_tokens = 32000
# Below the [auth] fields: in TOML, every key after a table header belongs
# to that table.
# [[auth.keys]]
# id = "k1"
# ed25519_public_key = "<printed by wye token keygen>"
#
# Identity-provider tokens, verified directly: CI workload identity or the
# team's IdP (through Claude Code's apiKeyHelper). Commit the provider's JWKS
# next to this file (for GitHub Actions:
# https://token.actions.githubusercontent.com/.well-known/jwks) and update it
# when the provider rotates keys; Wye never fetches it. With issuers, the
# issuer, audience, and [[auth.keys]] above are optional.
# [[auth.issuers]]
# issuer = "https://token.actions.githubusercontent.com"
# audience = "wye-prod"
# algorithm = "RS256"                  # or ES256, EdDSA; pinned, never read from the token
# jwks_file = "github.jwks"            # read at startup
# subject_claim = "repository"         # names the subject; default "sub"
# Models by claim value (a string claim equal to value, or a list containing
# it). A token matching no grant may use no model; omit grants to leave the
# [auth] models ceiling in charge.
# [[auth.issuers.grants]]
# claim = "repository_owner"
# value = "acme"
# models = ["claude-haiku-*"]

# Cache-miss diagnostics: keyed hashes of the prompt sections in each usage
# record, so a telemetry backend can tell why a prompt-cache read missed
# (docs/research.md, "Cache-miss diagnostics"). The key is required, at least
# 32 bytes, and the same on every replica: `openssl rand -hex 32`. Scanning
# costs CPU per uploaded MB; sample_percent diagnoses that share of Claude
# Code sessions, each one completely, chosen alike on every replica.
# [cache_diagnostics]
# hash_key_env = "WYE_CACHE_HASH_KEY"
# sample_percent = 100

# Usage records as OTLP logs, metrics, and per-session traces (OTLP/HTTP,
# JSON) to a collector or a backend that accepts OTLP directly, at
# {otlp_endpoint}/v1/logs, /v1/metrics, and /v1/traces. Records also stay in
# the stderr log.
# [telemetry]
# otlp_endpoint = "http://localhost:4318"  # no credentials in the URL
# otlp_headers_env = "OTLP_HEADERS"    # extra headers, "key=value,key2=value2": the API key goes here
# service_name = "wye"

# Model catalog for GET /v1/models (absent without this section): Claude
# Code's /model picker lists these when developers set
# CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY=1. Up to 1000 models; each
# caller sees only those its credential may use. Claude Code keeps ids that
# contain "claude" or "anthropic".
# [discovery]
# models = [
#   { id = "claude-sonnet-5-5", display_name = "Claude Sonnet 5.5", description = "Everyday coding" },
#   { id = "claude-haiku-5-5" },       # display_name and description are optional
# ]

# Model aliases (up to 256): clients ask for a stable name, config decides
# the model, and a model upgrade is one reviewed change here. Permissions
# apply to the model that runs; usage records show both (requested_model,
# model). `when` rules (up to 32, first match by subject) move matching
# credential subjects first. Claude Code's /model picker lists only ids
# containing "claude" or "anthropic", so name aliases it should show
# accordingly.
# [[aliases]]
# name = "claude-coding"
# model = "claude-opus-5-5"
# when = [{ subjects = ["team-canary-*"], model = "claude-sonnet-5-5" }]

# Prices, so every usage record carries its cost. Copy them from the
# provider's pricing page; a price change is a reviewed commit. USD per
# million tokens as decimal strings, at most 6 decimals. Up to 256 entries,
# matched by the model the provider reported: entries scoped to the serving
# upstream first, then the first unscoped match. Unknown prices are
# "unknown", never $0 (rules: docs/policy.md, "Pricing metadata").
# [pricing]
# version = "anthropic-2026-10-06"     # recorded with every cost
# [[pricing.models]]
# models = ["claude-opus-5-5"]
# upstreams = ["aws-us-west-2"]        # only for these route upstreams (partner or regional prices)
# input = "4.00"
# output = "20.00"
# cache_read = "0.40"                  # optional, like the cache writes below
# cache_write_5m = "5.00"
# cache_write_1h = "8.00"
# Up to 8 tiers per entry: prices above a prompt length (input plus cache
# reads and writes), the rest inherited from the entry:
# [[pricing.models.tiers]]
# above_prompt_tokens = 200000
# input = "8.00"

# Upgrade checks: before an alias or a client moves to a newer model, report
# which requests that model would reject (a manual thinking budget, forced
# tool_choice, prefill, ...). Report only; requests are never changed.
# Results: upgrade_issues in usage records, wye.upgrade.issues in OTLP,
# `wye report`, and `wye explain --config wye.toml --target-model <model> request.json`.
# [upgrade_check]
# targets = ["claude-opus-5-5"]        # up to 16 models
# sample_percent = 100                 # share of sessions (or clients) checked; lower it on busy fleets
